name: pounce
description: "Pounce – a fast, open-source SoundCloud & web radio player with a DJ mode. Inspired by KittyTune (GPL-3.0)."
publish_to: 'none'
version: 0.2.0-beta.3+10

environment:
  sdk: ^3.13.4

dependencies:
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  intl: ^0.20.3
  path_provider: ^2.1.6
  web: ^1.1.1
  native_player:
    path: packages/native_player
  native_auth:
    path: packages/native_auth

  material_ui: ^1.6.0
  cupertino_ui: ^1.1.2
  crypto: ^3.0.7
  sqlite3: ^3.7.0
  qr: ^4.0.0
  url_launcher: ^6.3.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
