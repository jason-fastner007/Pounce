name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  app:
    name: Analyze & test (Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Translations are generated from tool/gen_arb.py
        run: |
          python3 tool/gen_arb.py
          git diff --exit-code lib/l10n
      - run: flutter analyze
      - run: flutter test

  android:
    name: Build Android (github flavor)
    runs-on: ubuntu-latest
    needs: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # No signing secrets on pull requests: Gradle falls back to the debug key.
      - run: flutter build apk --release --flavor github --target-platform android-arm64 --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: pounce-apk-ci
          path: build/app/outputs/flutter-apk/*-github-release.apk
          retention-days: 7
