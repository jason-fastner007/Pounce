name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  app:
    name: Analyze & test (Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Translations are generated from tool/gen_arb.py
        run: |
          python3 tool/gen_arb.py
          git diff --exit-code lib/l10n
      - run: flutter analyze
      - run: flutter test

  android:
    name: Build Android (github flavor)
    runs-on: ubuntu-latest
    needs: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build apk --release --flavor github --target-platform android-arm64 --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: pounce-apk-ci
          path: build/app/outputs/flutter-apk/*-github-release.apk
          retention-days: 7

  ios:
    name: Build iOS (⚠️ Untested)
    runs-on: macos-latest
    needs: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Display iOS untested warning
        run: |
          echo "::warning title=iOS Untested::This app has NOT been tested on real iOS devices! Proceed with caution."
          echo "### ⚠️ Warning: Untested iOS Build" >> $GITHUB_STEP_SUMMARY
          echo "Pounce is developed and tested primarily for Android." >> $GITHUB_STEP_SUMMARY
          echo "This iOS build compiles from the same codebase, but is **NOT actively tested on iOS devices**." >> $GITHUB_STEP_SUMMARY
          echo "Audio playback, background services, or UI components may have issues." >> $GITHUB_STEP_SUMMARY
      - run: flutter pub get
      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir -p dist/Payload
          cp -r build/ios/iphoneos/Runner.app dist/Payload/
          cat << 'EOF' > dist/README-UNTESTED-IOS.txt
          ⚠️ WARNING: UNTESTED iOS BUILD ⚠️

          This build of Pounce for iOS is experimental and has NOT been tested on physical iOS devices.
          Pounce is primarily developed and tested on Android.
          Some features (background audio, lock screen controls, DJ transitions, etc.) may be incomplete or unstable.

          Please report issues or your testing experiences at:
          https://github.com/jason-fastner007/Pounce/issues
          EOF
          (cd dist && zip -r -y pounce-ios-untested.ipa Payload README-UNTESTED-IOS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: pounce-ios-untested
          path: dist/pounce-ios-untested.ipa
          retention-days: 7

  linux:
    name: Build Linux (AppImage & tar.gz)
    runs-on: ubuntu-latest
    needs: app
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev libasound2-dev liblzma-dev file
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Linux Desktop
        run: flutter build linux --release

      - name: Package Linux tar.gz
        run: |
          mkdir -p dist
          tar -czvf dist/pounce-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Build AppImage
        run: bash tool/package_appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: pounce-linux-appimage
          path: dist/pounce-linux-x86_64.AppImage
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: pounce-linux-targz
          path: dist/pounce-linux-x64.tar.gz
          retention-days: 7

  windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    needs: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Windows
        run: flutter build windows --release
      - name: Package Windows ZIP
        shell: pwsh
        run: |
          mkdir -p dist
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "dist/pounce-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: pounce-windows-x64
          path: dist/pounce-windows-x64.zip
          retention-days: 7

  macos:
    name: Build macOS
    runs-on: macos-latest
    needs: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build macOS
        run: flutter build macos --release
      - name: Package macOS ZIP
        run: |
          mkdir -p dist
          (cd build/macos/Build/Products/Release && zip -r -y "$GITHUB_WORKSPACE/dist/pounce-macos.zip" *.app)
      - uses: actions/upload-artifact@v4
        with:
          name: pounce-macos
          path: dist/pounce-macos.zip
          retention-days: 7

  web:
    name: Build Web (Wasm)
    runs-on: ubuntu-latest
    needs: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Web
        run: flutter build web --wasm
      - name: Package Web ZIP
        run: |
          mkdir -p dist
          (cd build/web && zip -r "$GITHUB_WORKSPACE/dist/pounce-web.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: pounce-web
          path: dist/pounce-web.zip
          retention-days: 7
