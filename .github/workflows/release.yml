name: Release

# Push a tag like v0.2.0-beta.1 to build signed APKs and an AAB and publish a GitHub release.
# Tags with a "-" (beta, rc) are published as pre-releases.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Check tag matches pubspec version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pub=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          [ "$tag" = "$pub" ] || { echo "Tag $tag != pubspec $pub"; exit 1; }

      # Secrets (Settings → Secrets and variables → Actions):
      #   POUNCE_KEYSTORE_BASE64  base64 of the upload keystore (.jks)
      #   POUNCE_KEYSTORE_PASSWORD, POUNCE_KEY_ALIAS, POUNCE_KEY_PASSWORD
      - name: Restore keystore
        env:
          KEYSTORE_B64: ${{ secrets.POUNCE_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_B64" ] || { echo "::error::POUNCE_KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "POUNCE_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      # arm64 only: the bundled Rust engine (libdeckengine.so) is built for arm64-v8a.
      - name: Build APK (github flavor, with in-app updater)
        env:
          POUNCE_KEYSTORE_PASSWORD: ${{ secrets.POUNCE_KEYSTORE_PASSWORD }}
          POUNCE_KEY_ALIAS: ${{ secrets.POUNCE_KEY_ALIAS }}
          POUNCE_KEY_PASSWORD: ${{ secrets.POUNCE_KEY_PASSWORD }}
        run: |
          flutter build apk --release --flavor github --target-platform android-arm64 --split-per-abi \
            --dart-define=POUNCE_GITHUB_REPO=${{ github.repository }}

      - name: Build AAB (play flavor)
        env:
          POUNCE_KEYSTORE_PASSWORD: ${{ secrets.POUNCE_KEYSTORE_PASSWORD }}
          POUNCE_KEY_ALIAS: ${{ secrets.POUNCE_KEY_ALIAS }}
          POUNCE_KEY_PASSWORD: ${{ secrets.POUNCE_KEY_PASSWORD }}
        run: flutter build appbundle --release --flavor play --target-platform android-arm64

      - name: Collect assets + SHA256SUMS
        run: |
          v="${GITHUB_REF_NAME#v}"
          mkdir dist
          o=build/app/outputs/flutter-apk
          cp "$o/app-arm64-v8a-github-release.apk" "dist/pounce-$v-arm64-v8a-github.apk"
          cp build/app/outputs/bundle/playRelease/app-play-release.aab "dist/pounce-$v-play.aab"
          (cd dist && sha256sum *.apk *.aab > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""; case "$GITHUB_REF_NAME" in *-*) pre="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "Pounce ${GITHUB_REF_NAME}" --generate-notes $pre

  ios:
    name: Build iOS (⚠️ Untested)
    runs-on: macos-latest
    needs: android
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Display iOS untested warning
        run: |
          echo "::warning title=iOS Untested::This app has NOT been tested on real iOS devices! Proceed with caution."
          echo "### ⚠️ Warning: Untested iOS Build" >> $GITHUB_STEP_SUMMARY
          echo "Pounce is developed and tested primarily for Android." >> $GITHUB_STEP_SUMMARY
          echo "This iOS build is compiled from the same codebase, but is **NOT actively tested on iOS devices**." >> $GITHUB_STEP_SUMMARY
      - run: flutter pub get
      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          v="${GITHUB_REF_NAME#v}"
          mkdir -p dist/Payload
          cp -r build/ios/iphoneos/Runner.app dist/Payload/
          cat << 'EOF' > dist/README-UNTESTED-IOS.txt
          ⚠️ WARNING: UNTESTED iOS BUILD ⚠️

          This build of Pounce for iOS is experimental and has NOT been tested on physical iOS devices.
          Pounce is primarily developed and tested on Android.
          Some features (background audio, lock screen controls, DJ transitions, etc.) may be incomplete or unstable.

          Please report issues or your testing experiences at:
          https://github.com/jason-fastner007/Pounce/issues
          EOF
          (cd dist && zip -r -y "pounce-$v-ios-untested.ipa" Payload README-UNTESTED-IOS.txt)
      - name: Attach iOS build to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          gh release upload "$GITHUB_REF_NAME" "dist/pounce-$v-ios-untested.ipa" --clobber
