name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing the Pounce beta! Please search existing issues first.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the DJ tab
        2. Pick "Techno" and start a mix
        3. Skip twice …
  - type: input
    id: version
    attributes:
      label: Pounce version
      description: Settings → About
      placeholder: 0.2.0-beta.1
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Android, iOS, Web, Linux, Windows, macOS]
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device / OS version
      placeholder: Pixel 8, Android 16
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Optional. `adb logcat | grep -i flutter` or the debug export. Please remove anything personal.
      render: text
